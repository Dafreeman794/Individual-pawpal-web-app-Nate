<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

</head>
<body class="home">

    <header>
        <nav class="navbar">
            <ul class="list"> 
                <li class="newpet"><a href="add.new.html"><img src="Images/image 6.png"></a></li>
                <li class="activity"><a href="activities.html"><img src="Images/ball.png"></a></li>
                <li class="special"><a href="special.needs.html"><img src="images/pill.png"></a></li>
                <li class="stats"><a href="stats.html"><img src="images/stats.png"></a></li>
                <li class="settings"><a href="settings.html"><img src="images/Gear.png"></a></li>
             </ul>
        </nav>
    </header>

        </nav>
        <section class="needs">
        <p>Because your pet is a golden retreiver, they especially need:</p>
        <ul>
            <li class="special-needs">A spacious yard, since they are medium sized but more importantly, they are very active</li>
                <li class="special-needs">Patience, since they are attention seekers</li>
                    </section>
                </ul>
                <br>
                <section class="events">
                    <p>Events</p>
                    <div id="mobileEventList"></div>
                        <img src="Images/Vet.png" alt="pill">
                    </section>
                    <section class="add-new">
                        <button class="add-event">Add Event</button>
                    </section>
     <script src="Pal.js"></script>
     <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("mobileEventList");
            if (!container) return;
        
            let savedEvents = [];
            try {
                savedEvents = JSON.parse(localStorage.getItem("events") || "[]");
                if (!Array.isArray(savedEvents)) savedEvents = [];
            } catch {
                savedEvents = [];
            }
        
            if (savedEvents.length === 0) {
                container.innerHTML = `<p class="empty-note">No events yet.</p>`;
                return;
            }
        
            savedEvents.forEach(event => {
                const card = document.createElement("div");
                card.className = "mobile-event-card";
        
                card.innerHTML = `
                    <img src="${escapeHtml(event.image || 'images/default.png')}" alt="Event">
                    <p class="event-name">${escapeHtml(event.name)}</p>
                    <p class="event-date">${formatDate(event.date)}</p>
                    <p class="event-time">${formatTime(event.time)}</p>
                `;
        
                container.appendChild(card);
            });
        });
        
        /* --- Safe formatting helpers (same style your main JS uses) --- */
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString(undefined, {
                month: "long",
                day: "numeric",
                year: "numeric"
            });
        }
        
        function formatTime(timeStr) {
            if (!timeStr) return "";
            const [hour, minute] = timeStr.split(":");
            let h = +hour;
            let suffix = "AM";
        
            if (h >= 12) {
                suffix = "PM";
                if (h > 12) h -= 12;
            } else if (h === 0) {
                h = 12;
            }
        
            return `${h}:${minute} ${suffix}`;
        }
        
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }
        </script>
        
</body>
</html>

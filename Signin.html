
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="PP.css">
    <link rel="icon" href="images/pixil-frame-0 (17).png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <title>Sign In</title>
  </head>
<body class="sign-in">
      <h1>Welcome to <br> Wellnesti!</h1>
      
      <p>Your pet's cozy digital nest for care, love, and level-ups!</p>

      <label for="email">Email</label>
      <input id="emailInput" type="text" placeholder="Please enter your Email">

      <label for="password">Password</label>
      <input id="passwordInput" type="password" placeholder="Please enter your Password">

      <button type="button" id="signInBtn">Sign In</button>
      <script>

        /* ----------------------------- Sign-in Page ----------------------------- */
document.addEventListener("DOMContentLoaded", () => {
  if (!document.body.classList.contains("sign-in")) return;

  const emailInput = document.getElementById("emailInput");
  const passwordInput = document.getElementById("passwordInput");
  const signInBtn = document.getElementById("signInBtn");

  if (!emailInput || !passwordInput || !signInBtn) return;

  signInBtn.addEventListener("click", () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
      alert("Please enter both an email and a password.");
      return;
    }

    // OPTIONAL: very basic email format check
    if (!email.includes("@")) {
      alert("Please enter a valid email address.");
      return;
    }

    // Save sign-in state (simple client-side auth)
    localStorage.setItem("signedIn", "true");
    localStorage.setItem("userEmail", email);

    console.log("Sign-in JS active", signInBtn);

    // Redirect
    window.location.href = "Home.html";
  });
});

      </script>
      <script src="Pal.js"></script> 
  </body>
</html>
